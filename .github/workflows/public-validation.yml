name: Public candidate validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: public-validation (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c "import os, subprocess; expected=os.environ['EXPECTED_SHA']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); print(f'EXPECTED_SHA={expected}'); print(f'CHECKED_OUT_SHA={actual}'); raise SystemExit(0 if actual == expected else 1)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Runtime identity
        run: python -VV

      - name: Validate public candidate
        run: python -B -S tools/run_public_validation.py
